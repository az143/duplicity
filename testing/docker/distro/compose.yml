name: distro

services:

    ub22:
        image: distro/ub22
        container_name: ub22
        hostname: ub22
        tty: true
        environment:
            - PYTEST_ARGS=${PYTEST_ARGS:-""}
        entrypoint: /bin/bash
        command: -c "sleep 2 ; make ext ; pytest ${PYTEST_ARGS:-""}"
        volumes:
            - ../../..:/root/duplicity
            - pytest_ub22:/root/duplicity/.pytest_cache

    ub24:
        image: distro/ub24
        container_name: ub24
        hostname: ub24
        tty: true
        environment:
            - PYTEST_ARGS=${PYTEST_ARGS:-""}
        entrypoint: /bin/bash
        command: -c "sleep 4 ; make ext ; pytest ${PYTEST_ARGS:-""}"
        volumes:
            - ../../..:/root/duplicity
            - pytest_ub24:/root/duplicity/.pytest_cache

    ub26:
        image: distro/ub26
        container_name: ub26
        hostname: ub26
        tty: true
        environment:
            - PYTEST_ARGS=${PYTEST_ARGS:-""}
        entrypoint: /bin/bash
        command: -c "sleep 6 ; make ext ; pytest ${PYTEST_ARGS:-""}"
        volumes:
            - ../../..:/root/duplicity
            - pytest_ub26:/root/duplicity/.pytest_cache

volumes:
    pytest_ub22:
    pytest_ub24:
    pytest_ub26:
